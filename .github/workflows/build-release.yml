# SoundBlast — بناء نسخة الإصدار (APK) على GitHub Actions
#
# نفس نمط نظام القسم (UniAxis): كل وسم v* يبني الـ APK بتوقيع الإصدار
# ويرفقه في GitHub Releases برابط تنزيل مباشر — بدون درايف ولا روابط
# تنتهي. التشغيل: من تبويب Actions → "Build release" → Run workflow،
# أو ادفع وسماً v* فيُبنى تلقائياً.
#
# الأسرار المطلوبة في الريبو (Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_BASE64 — ملف soundblast-release.keystore بصيغة base64
#   KEYSTORE_PASSWORD       — كلمة مرور المخزن (من android/key.properties)
#   KEY_ALIAS               — soundblast
#   KEY_PASSWORD            — كلمة مرور المفتاح (من android/key.properties)
# لا تُكتب كلمات المرور في الكود أبداً.

name: Build release (APK)
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.35.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/soundblast-release.keystore
          echo "ANDROID_KEYSTORE_FILE=$PWD/android/app/soundblast-release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (no errors)
        run: flutter analyze --no-fatal-infos

      - name: Build APK arm64 (release)
        run: flutter build apk --release --target-platform android-arm64

      - name: Build APK universal (release)
        run: flutter build apk --release

      - name: Verify APKs (aapt2 badging + signing)
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | head -1)
          for APK in build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/app-release.apk; do
            echo "== $APK =="
            "$AAPT2" dump badging "$APK" | grep -E "package:|launchable-activity|native-code"
            "$APKSIGNER" verify --print-certs "$APK" | head -4
            ls -lh "$APK"
          done

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')"
          TAG="v$VER"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "soundblast-${VER}-arm64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "soundblast-${VER}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "soundblast-${VER}-arm64.apk" "soundblast-${VER}.apk" --clobber
          else
            gh release create "$TAG" --title "SoundBlast $TAG" --notes "SoundBlast $TAG — same screens, design and features as the website, offline playback, background playback with media notification." "soundblast-${VER}-arm64.apk" "soundblast-${VER}.apk"
          fi
